profile:
  name: "林悠暉"
  summary: |
    Webエンジニアとして約9年の実務経験があり、直近5年はフロントエンド領域を中心に活動しています。
    React / Next.js / TypeScript を軸としたSPA・SSR開発が得意で、技術選定・アーキテクチャ設計からCI/CD構築、メンバー育成まで一貫して担当できます。
    Node.jsによるバックエンド実装やスキーマ駆動でのAPI設計も対応可能です。
    キャリア初期にはインフラエンジニアとしてサーバ設計・ネットワーク運用に従事しており、フロントエンドからインフラまで幅広い知見を持っています。
  strengths:
    - title: "フロントエンド設計・実装"
      detail: "React / Next.js（App Router）でのSPA・SSR開発、featuresベースのディレクトリ設計"
    - title: "スキーマ駆動開発"
      detail: "OpenAPI定義からのクライアント自動生成（orval）を活用したAPI連携"
    - title: "開発基盤の改善"
      detail: "CI/CD整備、ビルド高速化（Webpack→Vite移行でビルド時間を最大90%短縮）、ChatOpsによるリリース自動化"

