<!DOCTYPE html>
<html lang="ja">
<meta charset="UTF-8">
<title>ポートフォリオ動作確認</title>
<link rel="icon" href="data:,">
<h1>ポートフォリオ動作確認</h1>
<p id="result" role="status">確認中…</p>
<iframe title="検証するポートフォリオ" style="width:1440px;height:1100px;border:0"></iframe>
<script type="module">
  const frame = document.querySelector('iframe');
  const result = document.querySelector('#result');
  const projects = [
    ['一言日記', 'https://apps.apple.com/jp/app/id6763487075'],
    ['wish notes', null],
    ['かぞくのパスワード帳', 'https://apps.apple.com/jp/app/id6796645047'],
    ['無限リマインダー', 'https://apps.apple.com/jp/app/id6765719923'],
    ['workout-mcp', null],
    ['Editor Tab Manager', 'https://github.com/884js/editor-tab-manager'],
    ['Expo iOS Release', 'https://github.com/884js/expo-ios-release-agent-plugin'],
    ['agent-plugins', 'https://github.com/884js/agent-plugins'],
  ];
  let checks = 0;
  function assert(condition, message) {
    if (!condition) throw new Error(message);
    checks++;
  }
  frame.onload = async () => {
    try {
      const doc = frame.contentDocument;
      const rows = [...doc.querySelectorAll('.project-row')];
      assert(rows.length === projects.length, '8作品を表示する');
      for (const [index, row] of rows.entries()) {
        const [title, url] = projects[index];
        assert(row.querySelector('h3').textContent === title, title + 'を表示する');
        assert(url ? row.href === url : !row.matches('a') && !row.querySelector('a'), title + 'の公開先を維持する');
        if (!url) assert(row.querySelector('.project-status').textContent === '公開準備中', title + 'の公開状況を表示する');
        const icon = row.querySelector('img');
        await icon.decode();
        assert(icon.naturalWidth > 0, title + 'のアイコンを読み込める');
      }
      for (const link of doc.querySelectorAll('a[target="_blank"]')) {
        assert(link.relList.contains('noopener') && link.relList.contains('noreferrer'), '外部リンクを安全に開く');
      }
      for (const width of [1440, 768, 390, 320]) {
        frame.style.width = width + 'px';
        await new Promise(resolve => frame.contentWindow.requestAnimationFrame(() => frame.contentWindow.requestAnimationFrame(resolve)));
        assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, width + 'px幅で横にはみ出さない');
        for (const link of doc.querySelectorAll('.project-row[href]')) {
          assert(link.getBoundingClientRect().height >= 44, width + 'px幅で作品リンクを押しやすい大きさにする');
        }
      }
      frame.style.width = '1440px';
      result.textContent = 'PASS: ' + checks + '項目を確認しました。';
    } catch (error) {
      result.textContent = 'FAIL: ' + error.message;
    }
  };
  frame.src = '../dist/index.html';
</script>
</html>
