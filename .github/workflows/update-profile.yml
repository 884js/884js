name: Update Profile

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 UTC 00:00
  workflow_dispatch:       # 手動実行

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROFILE_GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # キャッシュから前回データを復元
      - uses: actions/cache/restore@v4
        id: data-cache
        with:
          key: github-data-${{ github.run_id }}
          restore-keys: github-data-
          path: data/

      # Step 1: データ収集（Bash）- Claude不要、差分更新対応
      - name: Collect GitHub data
        run: |
          bash scripts/collect-github-data.sh
          echo "## Data Collection" >> $GITHUB_STEP_SUMMARY
          echo "org_repos: $(jq '.org_repos | length' data/github-data.json)" >> $GITHUB_STEP_SUMMARY
          echo "personal_repos: $(jq '.personal_repos | length' data/github-data.json)" >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}

      # Step 2: 静的 HTML 生成（Bash）- Claude不要
      - name: Generate static site
        run: |
          bash scripts/generate-site.sh
          echo "## Static Site Generation" >> $GITHUB_STEP_SUMMARY
          echo "Generated dist/index.html" >> $GITHUB_STEP_SUMMARY
          DYNAMIC_COUNT=$(grep -c 'DYNAMIC_CAREER:' dist/index.html || true)
          echo "Dynamic placeholders: $DYNAMIC_COUNT" >> $GITHUB_STEP_SUMMARY

      # Step 3: 動的部分のみ Claude で生成（has_org: true + projects 空の会社のみ）
      - uses: anthropics/claude-code-action@v1
        id: claude-dynamic
        with:
          github_token: ${{ secrets.PROFILE_GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは職務経歴書サイトの動的セクションを生成するエージェントです。

            ## 目的
            dist/index.html に含まれる `<!-- DYNAMIC_CAREER:会社名 -->` プレースホルダーを、
            GitHub データを分析して生成した職務経歴 HTML で置換すること。

            ## 重要: データ分析アプローチ
            career.yml の情報をそのまま繰り返すのではなく、GitHub データ（PR title/body/additions/deletions）を
            実際に分析して、career.yml には書かれていない具体的な技術的取り組みを推定・記載すること。
            career.yml の strengths と同じ内容を achievements に書くのは NG。
            GitHub データから読み取れる実際の開発活動（機能開発、バグ修正、設計改善、CI/CD整備等）を反映させる。

            ## 入力データ
            - dist/index.html: generate-site.sh で生成済みの HTML（DYNAMIC_CAREER プレースホルダーあり）
            - data/github-data.json: GitHub API から収集したデータ
            - career.yml: 職務経歴データ（会社の role / business をコンテキストとして活用）
            - templates/examples/career-example.html: 出力の構成・粒度の参考

            ## 生成手順

            1. dist/index.html を読み込み、`<!-- DYNAMIC_CAREER:会社名 -->` を探す
            2. 各プレースホルダーについて以下の手順で HTML を生成:

            ### Step 1: Org を特定する
            - career.yml の会社名・事業内容と、data/github-data.json の org_repos の org フィールドを照合し、対象 Org を特定する
            - 対象 Org のリポジトリと my_merged_prs を分析対象にする

            ### Step 2: リリースPRを除外する
            - PRタイトルに "リリース" "release" "deploy" "Staging" "staging" を含むPRはフィルタリングする
            - これらは統計（リリース回数）としてのみ活用する
            - 残ったPRを「機能開発PR」として分析対象にする

            ### Step 3: 機能開発PRをカテゴリ分類する
            - PRタイトルのプレフィックス（[API], [Web], [DB設計] 等）やキーワードからカテゴリを推定
            - カテゴリ例: API開発, フロントエンド改善, DB設計, AI/LLM機能, CI/CD整備, バグ修正, Shopifyカスタマイズ
            - 各カテゴリのPR数・additions/deletions合計を算出する

            ### Step 4: カテゴリをプロジェクト単位に構造化する
            - 2件以上のPRがあるカテゴリをプロジェクトとして生成する
            - 各プロジェクトには以下を含める:
              - 一般化したプロジェクト名（ドメイン固有用語は使わない）
              - 期間（PRのmerged_at の最古〜最新から推定）
              - 技術スタック（PRの変更内容・リポジトリの言語情報から推定）
              - 概要（何を目的とした開発か）
              - 成果リスト（PRデータに基づく具体的な取り組み。PR件数や行数で規模感も示す）
            - career.yml の role / business をコンテキストとして活用する

            ### Step 5: プライバシー一般化を適用する
            - プロダクト固有の用語は一般化する
              例: "コンサル画面疾患・薬剤情報提供" → "専門家向け情報提供機能"
              例: "HubSpotアンケート→コンサル文" → "外部サービス連携による自動文書生成"
              例: "ゲストQ" → "ユーザー向け質問・回答機能"
            - Org名・リポジトリ名・プロダクト固有名は絶対に含めない

            3. 生成した HTML で `<!-- DYNAMIC_CAREER:会社名 -->` を置換して dist/index.html に書き戻す
            4. templates/examples/career-example.html を参考に構成・粒度を揃えること

            ## 出力フォーマット
            各プレースホルダーを、career-project div のリストで置換する。
            既存の career-item div の中身（会社名・期間・役職・事業内容の後）に挿入される形になる。

            ## 制約
            - CLAUDE.md のプライバシー保護ルールを厳守
            - 日本語で生成すること
            - dist/index.html 以外のファイルは変更しない
          claude_args: "--model claude-sonnet-4-6 --max-turns 30 --allowedTools Read,Edit,Glob,Grep"

      # Step 4: 変更があればPR作成（Bash）- Claude不要
      - name: Create PR if changed
        env:
          GH_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
          DYNAMIC_USAGE: ${{ steps.claude-dynamic.outputs.usage }}
        run: |
          # Token Usage を Step Summary に出力
          echo "## Token Usage" >> $GITHUB_STEP_SUMMARY
          echo "### Dynamic Career Generation" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$DYNAMIC_USAGE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # 変更チェック
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "## Result" >> $GITHUB_STEP_SUMMARY
            echo "No changes detected." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # ブランチ作成 → コミット → プッシュ → PR作成
          BRANCH="chore/update-profile-$(date +%Y-%m-%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update profile ($(date +%Y-%m-%d))"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: update profile ($(date +%Y-%m-%d))" \
            --body "職務経歴書サイトの自動更新"

          echo "## Result" >> $GITHUB_STEP_SUMMARY
          echo "PR created from branch $BRANCH" >> $GITHUB_STEP_SUMMARY

      # キャッシュ保存（データ収集結果を次回に引き継ぐ）
      - uses: actions/cache/save@v4
        if: always()
        with:
          key: github-data-${{ github.run_id }}
          path: data/
