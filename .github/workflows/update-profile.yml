name: Update Profile

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 UTC 00:00
  workflow_dispatch:       # 手動実行

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROFILE_GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # キャッシュから前回データを復元
      - uses: actions/cache/restore@v4
        id: data-cache
        with:
          key: github-data-${{ github.run_id }}
          restore-keys: github-data-
          path: data/

      # Step 1: データ収集（Bash）- Claude不要、差分更新対応
      - name: Collect GitHub data
        run: |
          bash scripts/collect-github-data.sh
          echo "## Data Collection" >> $GITHUB_STEP_SUMMARY
          echo "org_repos: $(jq '.org_repos | length' data/github-data.json)" >> $GITHUB_STEP_SUMMARY
          echo "personal_repos: $(jq '.personal_repos | length' data/github-data.json)" >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}

      # Step 2: 職務経歴書サイト生成（Claude）
      - uses: anthropics/claude-code-action@v1
        id: claude-site
        with:
          github_token: ${{ secrets.PROFILE_GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは就職活動用の職務経歴書サイトを生成するエージェントです。

            ## 目的
            採用担当が「この人の技術力と経験が具体的にわかる」職務経歴書サイトを生成すること。
            プロジェクト単位の詳細な経歴と、データに裏付けされた技術力を示す。

            ## 入力データ
            - data/github-data.json: GitHub API から収集したデータ
            - career.yml: 職務経歴データ（プロフィール・スキル・会社・プロジェクト情報）
            - templates/site/template.html: HTML テンプレート
            - templates/site/styles.css: スタイルシート

            ## 生成手順
            1. templates/site/styles.css を dist/styles.css にコピー
            2. templates/site/template.html のプレースホルダーを以下のルールで置換し dist/index.html を生成

            ## 各セクションの生成ルール

            ### ヘッダー
            - career.yml の profile.name を表示
            - profile.summary を概要として表示
            - profile.strengths を得意領域として表示

            ### Skills セクション ({{SKILLS_SECTION}})
            - career.yml の skills セクションから全カテゴリ（languages / frameworks / tools / practices / devops）をタグ表示

            ### Career セクション ({{CAREER_SECTION}})
            career.yml の各会社について:
            - 会社名・期間・役職・事業内容を表示
            - projects が定義されている場合: プロジェクト単位で詳細表示
              - プロジェクト名・期間・役割・チーム規模・技術スタック・概要・成果
            - has_org: true かつ projects が空の場合:
              - org_repos のデータから職務内容を自動推定する
              - my_merged_prs の title/body から担当した機能領域・技術的アプローチを推定
              - PRの規模（additions/deletions/changed_files）から貢献度を推定
              - 具体的なリポジトリ名・Org名・プロダクト名は絶対に含めない
              - ドメイン固有の用語は一般化する
            - templates/examples/career-example.html を参考に構成・粒度を揃えること

            ### Stats セクション ({{STATS_SECTION}})
            - マージ済みPR数（org_repos の my_merged_prs を合算）
            - 公開リポジトリ数
            - エンジニア経験年数（career.yml の最古の会社から算出）

            ## 制約
            - CLAUDE.md のプライバシー保護ルールを厳守
            - 日本語で生成すること
          claude_args: "--model claude-sonnet-4-6 --max-turns 30 --allowedTools Read,Write,Edit,Glob,Grep"

      # Step 3: 変更があればPR作成（Bash）- Claude不要
      - name: Create PR if changed
        env:
          GH_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
          SITE_USAGE: ${{ steps.claude-site.outputs.usage }}
        run: |
          # Token Usage を Step Summary に出力
          echo "## Token Usage" >> $GITHUB_STEP_SUMMARY
          echo "### Site Generation" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$SITE_USAGE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # 変更チェック
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "## Result" >> $GITHUB_STEP_SUMMARY
            echo "No changes detected." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # ブランチ作成 → コミット → プッシュ → PR作成
          BRANCH="chore/update-profile-$(date +%Y-%m-%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update profile ($(date +%Y-%m-%d))"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: update profile ($(date +%Y-%m-%d))" \
            --body "職務経歴書サイトの自動更新"

          echo "## Result" >> $GITHUB_STEP_SUMMARY
          echo "PR created from branch $BRANCH" >> $GITHUB_STEP_SUMMARY

      # キャッシュ保存（データ収集結果を次回に引き継ぐ）
      - uses: actions/cache/save@v4
        if: always()
        with:
          key: github-data-${{ github.run_id }}
          path: data/
