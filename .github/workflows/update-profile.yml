name: Update Profile

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 UTC 00:00
  workflow_dispatch:       # 手動実行

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROFILE_GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # キャッシュから前回データを復元
      - uses: actions/cache/restore@v4
        id: data-cache
        with:
          key: github-data-${{ github.run_id }}
          restore-keys: github-data-
          path: data/

      # Step 1: データ収集（Bash）- Claude不要、差分更新対応
      - name: Collect GitHub data
        run: |
          bash scripts/collect-github-data.sh
          echo "## Data Collection" >> $GITHUB_STEP_SUMMARY
          echo "org_repos: $(jq '.org_repos | length' data/github-data.json)" >> $GITHUB_STEP_SUMMARY
          echo "personal_repos: $(jq '.personal_repos | length' data/github-data.json)" >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}

      # Step 2: 静的 HTML 生成（Bash）- Claude不要
      - name: Generate static site
        run: |
          bash scripts/generate-site.sh
          echo "## Static Site Generation" >> $GITHUB_STEP_SUMMARY
          echo "Generated dist/index.html" >> $GITHUB_STEP_SUMMARY
          DYNAMIC_COUNT=$(grep -c 'DYNAMIC_CAREER:' dist/index.html || true)
          echo "Dynamic placeholders: $DYNAMIC_COUNT" >> $GITHUB_STEP_SUMMARY

      # Step 3: 動的部分のみ Claude で生成（has_org: true + projects 空の会社のみ）
      - uses: anthropics/claude-code-action@v1
        id: claude-dynamic
        with:
          github_token: ${{ secrets.PROFILE_GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/generate-dynamic-career"
          claude_args: "--model claude-sonnet-4-6 --max-turns 50 --allowedTools Read,Edit,Glob,Grep"

      # Step 4: 変更があればPR作成（Bash）- Claude不要
      - name: Create PR if changed
        env:
          GH_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
          DYNAMIC_USAGE: ${{ steps.claude-dynamic.outputs.usage }}
        run: |
          # Token Usage を Step Summary に出力
          echo "## Token Usage" >> $GITHUB_STEP_SUMMARY
          echo "### Dynamic Career Generation" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$DYNAMIC_USAGE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # 変更チェック
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "## Result" >> $GITHUB_STEP_SUMMARY
            echo "No changes detected." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # ブランチ作成 → コミット → プッシュ → PR作成
          BRANCH="chore/update-profile-$(date +%Y-%m-%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update profile ($(date +%Y-%m-%d))"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: update profile ($(date +%Y-%m-%d))" \
            --body "職務経歴書サイトの自動更新"

          echo "## Result" >> $GITHUB_STEP_SUMMARY
          echo "PR created from branch $BRANCH" >> $GITHUB_STEP_SUMMARY

      # キャッシュ保存（データ収集結果を次回に引き継ぐ）
      - uses: actions/cache/save@v4
        if: always()
        with:
          key: github-data-${{ github.run_id }}
          path: data/
