name: Update & Deploy Profile Site

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 UTC 00:00
  workflow_dispatch:       # 手動実行

permissions:
  contents: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROFILE_GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # R2 バケット作成（初回のみ、冪等）
      - name: Create R2 bucket if not exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 bucket create 884js-data
        continue-on-error: true

      # R2 から前回データを取得
      - name: Restore data from R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object get 884js-data/github-data.json --file ./data/github-data.json
        continue-on-error: true

      # Step 1: データ収集（Bash）- Claude不要、差分更新対応
      - name: Collect GitHub data
        run: |
          bash scripts/collect-github-data.sh
          echo "## Data Collection" >> $GITHUB_STEP_SUMMARY
          echo "org_repos: $(jq '.org_repos | length' data/github-data.json)" >> $GITHUB_STEP_SUMMARY
          echo "personal_repos: $(jq '.personal_repos | length' data/github-data.json)" >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}

      # Step 2: 静的 HTML 生成（Bash）- Claude不要
      - name: Generate static site
        run: |
          bash scripts/generate-site.sh
          echo "## Static Site Generation" >> $GITHUB_STEP_SUMMARY
          echo "Generated dist/index.html" >> $GITHUB_STEP_SUMMARY
          DYNAMIC_COUNT=$(grep -c 'DYNAMIC_CAREER:' dist/index.html || true)
          echo "Dynamic placeholders: $DYNAMIC_COUNT" >> $GITHUB_STEP_SUMMARY

      # Step 3: ハッシュ計算・比較（PR データに変化があるかチェック）
      - name: Restore career data from R2
        run: |
          mkdir -p data/career-hash data/career-json
          for FILE in career-hash/medii.sha256 career-hash/andd.sha256 career-json/medii.json career-json/andd.json; do
            npx wrangler r2 object get "884js-data/$FILE" --file "./data/$FILE" 2>/dev/null || echo "  $FILE: not found (first run)"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Compute hashes and compare
        id: hash-check
        run: |
          mkdir -p data/career-hash data/career-json

          # 会社キー → Org名 マッピング
          declare -A ORG_MAP=( ["medii"]="medii-jp" ["andd"]="anddtokyo" )
          ANY_CHANGED=false

          for KEY in medii andd; do
            ORG="${ORG_MAP[$KEY]}"

            # 現在の PR データからハッシュ計算
            CURRENT_HASH=$(jq -cS "[.org_repos[] | select(.org == \"$ORG\") | select(has(\"my_merged_prs\")) | .my_merged_prs[]] | sort_by(.merged_at)" data/github-data.json | sha256sum | cut -d' ' -f1)
            echo "$CURRENT_HASH" > "data/career-hash/${KEY}.sha256.new"

            # 前回ハッシュと比較
            PREV_HASH=""
            if [ -f "data/career-hash/${KEY}.sha256" ]; then
              PREV_HASH=$(cat "data/career-hash/${KEY}.sha256" | tr -d '[:space:]')
            fi

            if [ "$CURRENT_HASH" = "$PREV_HASH" ] && [ -f "data/career-json/${KEY}.json" ]; then
              echo "${KEY}_changed=false" >> $GITHUB_OUTPUT
              echo "  $KEY: unchanged (hash match)"
            else
              echo "${KEY}_changed=true" >> $GITHUB_OUTPUT
              ANY_CHANGED=true
              echo "  $KEY: CHANGED (hash mismatch or no previous data)"
            fi
          done

          echo "any_changed=$ANY_CHANGED" >> $GITHUB_OUTPUT
          echo "## Hash Check" >> $GITHUB_STEP_SUMMARY
          echo "any_changed: $ANY_CHANGED" >> $GITHUB_STEP_SUMMARY

      # Step 4: 動的部分のみ Claude で生成（ハッシュ不一致時のみ）
      - uses: anthropics/claude-code-action@v1
        if: steps.hash-check.outputs.any_changed == 'true'
        id: claude-dynamic
        with:
          github_token: ${{ secrets.PROFILE_GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/generate-dynamic-career"
          claude_args: "--model claude-sonnet-4-6 --max-turns 50 --allowedTools Read,Write,Glob,Grep"

      - name: Report token usage
        if: steps.hash-check.outputs.any_changed == 'true'
        env:
          DYNAMIC_USAGE: ${{ steps.claude-dynamic.outputs.usage }}
        run: |
          echo "## Token Usage" >> $GITHUB_STEP_SUMMARY
          echo "### Dynamic Career Generation" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$DYNAMIC_USAGE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Step 5: JSON → HTML 変換（Claude 実行・スキップどちらでも実行）
      - name: Render career HTML from JSON
        run: bash scripts/render-career.sh

      # Step 6: ハッシュ・JSON を R2 に保存（変化があった場合のみ）
      - name: Save career data to R2
        if: steps.hash-check.outputs.any_changed == 'true'
        run: |
          for KEY in medii andd; do
            npx wrangler r2 object put "884js-data/career-hash/${KEY}.sha256" --file "./data/career-hash/${KEY}.sha256.new" --content-type text/plain
            npx wrangler r2 object put "884js-data/career-json/${KEY}.json" --file "./data/career-json/${KEY}.json" --content-type application/json
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Step 7: Cloudflare Pages にデプロイ
      - name: Create Pages project if not exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create 884js --production-branch=master
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=884js

      - name: Report deploy result
        run: |
          echo "## Deploy" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to Cloudflare Pages" >> $GITHUB_STEP_SUMMARY

      # データを R2 に保存（次回に引き継ぐ）
      - name: Save data to R2
        if: always()
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put 884js-data/github-data.json --file ./data/github-data.json --content-type application/json
