name: Update & Deploy Profile Site

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 UTC 00:00
  workflow_dispatch:       # 手動実行

permissions:
  contents: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROFILE_GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # R2 バケット作成（初回のみ、冪等）
      - name: Create R2 bucket if not exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 bucket create 884js-data
        continue-on-error: true

      # R2 から前回データを取得
      - name: Restore data from R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object get 884js-data/github-data.json --file ./data/github-data.json
        continue-on-error: true

      # Step 1: データ収集（Bash）- Claude不要、差分更新対応
      - name: Collect GitHub data
        run: |
          bash scripts/collect-github-data.sh
          echo "## Data Collection" >> $GITHUB_STEP_SUMMARY
          echo "org_repos: $(jq '.org_repos | length' data/github-data.json)" >> $GITHUB_STEP_SUMMARY
          echo "personal_repos: $(jq '.personal_repos | length' data/github-data.json)" >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}

      # Step 2: 静的 HTML 生成（Bash）- Claude不要
      - name: Generate static site
        run: |
          bash scripts/generate-site.sh
          echo "## Static Site Generation" >> $GITHUB_STEP_SUMMARY
          echo "Generated dist/index.html" >> $GITHUB_STEP_SUMMARY
          DYNAMIC_COUNT=$(grep -c 'DYNAMIC_CAREER:' dist/index.html || true)
          echo "Dynamic placeholders: $DYNAMIC_COUNT" >> $GITHUB_STEP_SUMMARY

      # Step 3: 動的部分のみ Claude で生成（has_org: true + projects 空の会社のみ）
      - uses: anthropics/claude-code-action@v1
        id: claude-dynamic
        with:
          github_token: ${{ secrets.PROFILE_GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/generate-dynamic-career"
          claude_args: "--model claude-sonnet-4-6 --max-turns 50 --allowedTools Read,Edit,Glob,Grep"

      # Step 4: Token Usage レポート
      - name: Report token usage
        env:
          DYNAMIC_USAGE: ${{ steps.claude-dynamic.outputs.usage }}
        run: |
          echo "## Token Usage" >> $GITHUB_STEP_SUMMARY
          echo "### Dynamic Career Generation" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$DYNAMIC_USAGE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Step 5: Cloudflare Pages にデプロイ
      - name: Create Pages project if not exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create 884js --production-branch=master
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=884js

      - name: Report deploy result
        run: |
          echo "## Deploy" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to Cloudflare Pages" >> $GITHUB_STEP_SUMMARY

      # データを R2 に保存（次回に引き継ぐ）
      - name: Save data to R2
        if: always()
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put 884js-data/github-data.json --file ./data/github-data.json --content-type application/json
